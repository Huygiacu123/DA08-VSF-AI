name: deploy-ssh-verify (manual)

# Verify HARNESS cho VPS trial (df789.online, 2026-08-05) — KHÔNG deploy, chỉ kiểm tra
# đường SSH key (SSH_HOST/SSH_USER/SSH_PRIVATE_KEY) hoạt động đầu-cuối TRƯỚC khi chạy
# deploy.yml thật. Thay thế bản GCP WIF+IAP cũ (VPS này không phải GCP).
# Chạy TAY (workflow_dispatch).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: SSH read-only — chứng minh login + sudo + docker
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          SSHKEY="$(mktemp)"
          trap 'rm -f "$SSHKEY"' EXIT
          printf '%s' "$SSH_PRIVATE_KEY" > "$SSHKEY"
          chmod 600 "$SSHKEY"
          ssh -i "$SSHKEY" -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 \
            "${SSH_USER}@${SSH_HOST}" '
              echo "=== WHOAMI ==="; whoami; id
              echo "=== SUDO ==="; sudo -n true && echo SUDO_OK || echo NO_SUDO
              echo "=== DOCKER ==="; docker ps --format "{{.Names}}" | head -5 || echo DOCKER_FAIL
              echo "=== APP_DIR ==="; ls -d /home/TOMAP/DA08-VSF 2>/dev/null || echo "APP_DIR chưa clone"
              echo "=== VERIFY_DONE ==="
            '
